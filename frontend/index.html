<!DOCTYPE html>
<html>

<style>
body {
    background: linear-gradient(135deg, #eef2ff, #dbeafe);
}
</style>

<head>
  <title>Credible Sorcerer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-5 shadow d-flex flex-column"
     style="width: 1000px; min-height: 480px; border-radius: 15px;">

  <div class="d-flex flex-column justify-content-between h-100">

    <!-- Title Section -->
    <div>
      <h1 class="text-center mb-2">Credible Sorcerer</h1>

      <p class="text-center text-muted">
        AI-powered article credibility analyzer
      </p>
    </div>

    <!-- Input Section -->
    <div class="mt-4">
      <input 
        type="text" 
        class="form-control form-control-lg"
        placeholder="Paste article URL here..."
      >
    </div>

    <div class="mt-3">
      <input 
        type="file" 
        id="pdfInput"
        class="form-control form-control-lg"
        accept=".pdf"
      >
    </div>

    <!-- Button Section -->
    <div class="mt-4">
      <button class="btn btn-primary btn-lg w-100" onclick="analyzeArticle()">
        Analyze Article
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center mt-4" style="display:none;">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Analyzing article...</p>
    </div>

  </div>

</div>

<script>
async function analyzeArticle() {
  const urlInput = document.querySelector("input[type='text']");
  const pdfInput = document.getElementById("pdfInput");

  const url = urlInput.value.trim();
  const pdfFile = pdfInput.files[0];

  if (!url && !pdfFile) {
    alert("Please enter a URL or upload a PDF.");
    return;
  }

  document.getElementById("loadingSpinner").style.display = "block";

  try {
    let response;

    // If PDF uploaded, use PDF endpoint
    if (pdfFile) {
      const formData = new FormData();
      formData.append("file", pdfFile);

      response = await fetch("https://cpsc-491-capstone-project.onrender.com/summarize-pdf", {
        method: "POST",
        body: formData
      });
    } 
    // Otherwise use URL endpoint
    else {
      response = await fetch("https://cpsc-491-capstone-project.onrender.com/summarize", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ url: url })
      });
    }

    if (!response.ok) {
      throw new Error("Backend request failed");
    }

    const result = await response.json();
    localStorage.setItem("analysisResult", JSON.stringify(result));
    window.location.href = "report.html";

  } catch (error) {
    console.error("Error:", error);
    alert("Analysis failed.");
    location.reload();
  }
}
</script>

</body>
</html>
