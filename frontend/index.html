<!DOCTYPE html>
<html>

<style>
body {
    background: linear-gradient(135deg, #eef2ff, #dbeafe);
}
</style>

<style>
  .nav-link-custom {
    color: #333;
    text-decoration: none;
    font-weight: 600;
    transition: 0.2s ease;
  }

  .nav-link-custom:hover {
    color: #0d6efd;
    text-decoration: underline;
  }
</style>

<head>
  <title>Credible Sorcerer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<!-- NAVBAR (INDEX VERSION) -->
<div class="d-flex justify-content-end align-items-center px-4 py-3 border-bottom bg-white">
  <div class="d-flex gap-4">
    <a href="index.html" class="nav-link-custom">Home</a>
    <a href="report.html" class="nav-link-custom">Report</a>
    <a href="about.html" class="nav-link-custom">About</a>
  </div>
</div>

<div class="card p-5 shadow d-flex flex-column"
     style="width: 1000px; min-height: 520px; border-radius: 15px;">

  <div class="d-flex flex-column justify-content-between h-100">

    <!-- Title Section -->
    <div>
      <h1 class="text-center mb-2">Credible Sorcerer</h1>

      <p class="text-center text-muted">
        AI-powered article credibility analyzer
      </p>
    </div>

    <!-- URL Input -->
    <div class="mt-4">
      <input 
        type="text" 
        id="urlInput"
        class="form-control form-control-lg"
        placeholder="Paste article URL here..."
      >
    </div>

    <!-- PDF Upload -->
    <div class="mt-3">
      <input 
        type="file" 
        id="pdfInput"
        class="form-control form-control-lg"
        accept=".pdf"
      >
      <div id="pdfFileName" class="text-muted mt-2 small"></div>
    </div>

    <!-- Error Box -->
    <div id="errorBox" class="alert alert-danger mt-3 d-none" role="alert">
      <div id="errorMessage">Something went wrong.</div>
      <button id="retryButton" class="btn btn-sm btn-outline-danger mt-2 d-none" onclick="resetForm()">
        Try Again
      </button>
    </div>

    <!-- Button Section -->
    <div class="mt-4">
      <button id="analyzeButton" class="btn btn-primary btn-lg w-100" onclick="analyzeArticle()">
        Analyze Article
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center mt-4" style="display:none;">
      <div class="spinner-border text-primary" role="status"></div>
      <p id="loadingText" class="mt-2 text-muted">Analyzing article...</p>
    </div>

  </div>

</div>

<script>
const API_BASE = "https://cpsc-491-capstone-project.onrender.com";

const urlInput = document.getElementById("urlInput");
const pdfInput = document.getElementById("pdfInput");
const pdfFileName = document.getElementById("pdfFileName");
const analyzeButton = document.getElementById("analyzeButton");
const loadingSpinner = document.getElementById("loadingSpinner");
const loadingText = document.getElementById("loadingText");
const errorBox = document.getElementById("errorBox");
const errorMessage = document.getElementById("errorMessage");
const retryButton = document.getElementById("retryButton");

let loadingInterval = null;

pdfInput.addEventListener("change", function () {
  const file = pdfInput.files[0];
  pdfFileName.innerText = file ? `Selected file: ${file.name}` : "";
});

function showError(message, showRetry = true) {
  errorMessage.innerText = message;
  errorBox.classList.remove("d-none");
  retryButton.classList.toggle("d-none", !showRetry);
}

function hideError() {
  errorBox.classList.add("d-none");
  retryButton.classList.add("d-none");
}

function startLoadingText() {
  const messages = [
    "Extracting document content...",
    "Analyzing writing style...",
    "Generating summary and key points...",
    "Calculating credibility score..."
  ];
  let i = 0;
  loadingText.innerText = messages[0];

  loadingInterval = setInterval(() => {
    i = (i + 1) % messages.length;
    loadingText.innerText = messages[i];
  }, 1400);
}

function stopLoadingText() {
  if (loadingInterval) {
    clearInterval(loadingInterval);
    loadingInterval = null;
  }
}

function resetForm() {
  hideError();
  loadingSpinner.style.display = "none";
  stopLoadingText();
  analyzeButton.disabled = false;
  analyzeButton.innerText = "Analyze Article";
}

async function analyzeArticle() {
  const url = urlInput.value.trim();
  const pdfFile = pdfInput.files[0];

  hideError();

  // Validation: require one input
  if (!url && !pdfFile) {
    showError("Please enter a URL or upload a PDF.");
    return;
  }

  // Validation: do not allow both at once
  if (url && pdfFile) {
    showError("Please use only one input method at a time: either a URL or a PDF.");
    return;
  }

  analyzeButton.disabled = true;
  analyzeButton.innerText = "Processing...";
  loadingSpinner.style.display = "block";
  startLoadingText();

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 sec timeout

  try {
    let response;

    if (pdfFile) {
      const formData = new FormData();
      formData.append("file", pdfFile);

      response = await fetch(`${API_BASE}/summarize-pdf`, {
        method: "POST",
        body: formData,
        signal: controller.signal
      });
    } else {
      response = await fetch(`${API_BASE}/summarize`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ url: url }),
        signal: controller.signal
      });
    }

    clearTimeout(timeoutId);

    if (!response.ok) {
      const errText = await response.text();
      console.error("Backend error:", errText);
      throw new Error("The analysis request failed. Please try a different source.");
    }

    const result = await response.json();
    localStorage.setItem("analysisResult", JSON.stringify(result));
    window.location.href = "report.html";

  } catch (error) {
    clearTimeout(timeoutId);
    console.error("Error:", error);

    if (error.name === "AbortError") {
      showError("The request took too long and timed out. Please try again.", true);
    } else {
      showError("Analysis failed. Please check the URL or PDF and try again.", true);
    }

    resetForm();
  }
}
</script>

</body>
</html>
