<!DOCTYPE html>
<html>
<head>
  <title>Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Top Navigation -->
<div class="d-flex justify-content-end align-items-center p-3">
  <div class="d-flex gap-4">

    <a href="index.html" class="text-decoration-none text-dark fw-semibold">
      Home
    </a>

    <a href="report.html" class="text-decoration-none text-dark fw-semibold">
      Report
    </a>

    <a href="about.html" class="text-decoration-none text-dark fw-semibold">
      About
    </a>

  </div>
</div>

<!-- PAGE TITLE -->
<div class="container mt-4">
  <h1 class="text-center fw-bold">Report</h1>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-5">
  <div class="row g-4">

    <!-- LEFT COLUMN -->
    <div class="col-md-6">
      <div class="card p-4 shadow" style="height: 420px; border-radius: 20px; overflow-y: auto;">
        <h4 class="fw-bold" id="title">Document</h4>

        <div class="mt-2 text-muted" id="author"></div>
        <div class="text-muted mb-2" id="date"></div>

        <hr>

        <div class="mt-2" id="summary">
          Summary will appear here...
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-md-6">
      <div class="card p-4 shadow d-flex flex-column justify-content-between"
           style="height: 420px; border-radius: 20px;">

        <div>
          <h4 class="fw-bold text-center mb-4">Credibility Score</h4>

          <div class="progress mb-4" style="height: 24px; border-radius: 12px;">
            <div id="scoreBar" class="progress-bar bg-primary"
                 style="width: 0%; border-radius: 12px;">0%</div>
          </div>
          
          <div class="text-muted text-center" id="scoreText">
            Overall credibility analysis result
          </div>

        </div>

        <div class="d-grid gap-3 mt-4">
          <a href="detailed-report.html" class="btn btn-outline-secondary btn-lg">
            Detailed Report
          </a>

          <a href="score.html" class="btn btn-outline-secondary btn-lg">
            Score
          </a>

          <a href="index.html" class="btn btn-outline-secondary btn-lg">
            Home
          </a>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
window.onload = function() {

  const data = JSON.parse(localStorage.getItem("analysisResult"));

  if (!data) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("title").innerText = data.title || "No title";
  document.getElementById("summary").innerText = data.summary || "No summary";
  document.getElementById("author").innerText = "Author: " + (data.author || "Unknown");
  document.getElementById("date").innerText = "Published: " + (data.publication_date || "Unknown");

  const score = Math.round(data.score || 0);
  const scoreBar = document.getElementById("scoreBar");
  const scoreText = document.getElementById("scoreText");

  scoreBar.style.width = score + "%";
  scoreBar.innerText = score + "%";

  if (score >= 75) {
    scoreBar.classList.remove("bg-primary", "bg-warning", "bg-danger");
    scoreBar.classList.add("bg-success");
  } else if (score >= 50) {
    scoreBar.classList.remove("bg-primary", "bg-success", "bg-danger");
    scoreBar.classList.add("bg-warning");
  } else {
    scoreBar.classList.remove("bg-primary", "bg-success", "bg-warning");
    scoreBar.classList.add("bg-danger");
  }

  // Structured breakdown
  const breakdown = data.score_breakdown || {};

  function ratio(part) {
    if (!part || !part.total) return 0;
    return part.earned / part.total;
  }

  const titleRatio = ratio(breakdown.title);
  const authorRatio = ratio(breakdown.author);
  const dateRatio = ratio(breakdown.date);
  const linksRatio = ratio(breakdown.links);
  const aiRatio = ratio(breakdown.ai);

  // Group signals
  const metadataAvg = (titleRatio + authorRatio + dateRatio) / 3;
  const citationStrength = linksRatio;
  const aiConfidence = aiRatio;

  let metadataText = "";
  let citationText = "";
  let aiText = "";

  if (metadataAvg >= 0.8) {
    metadataText = "Strong metadata";
  } else if (metadataAvg >= 0.5) {
    metadataText = "Moderate metadata";
  } else {
    metadataText = "Weak metadata";
  }

  if (citationStrength >= 0.8) {
    citationText = "strong citation support";
  } else if (citationStrength >= 0.5) {
    citationText = "limited citation support";
  } else {
    citationText = "very weak citation support";
  }

  if (aiConfidence >= 0.8) {
    aiText = "strong AI confidence";
  } else if (aiConfidence >= 0.5) {
    aiText = "moderate AI confidence";
  } else {
    aiText = "weak AI confidence";
  }

  scoreText.innerText = `${metadataText}, ${citationText}, ${aiText}.`;

};
</script>

</body>
</html>
