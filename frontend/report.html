<!DOCTYPE html>
<html>
<head>
  <title>Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-light border-bottom px-4">
  <span class="navbar-brand fw-bold">Credible Sorcerer</span>

  <div class="d-flex gap-3">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="#">Report</a>
    <a class="nav-link" href="#">Page</a>
    <button class="btn btn-dark btn-sm">Button</button>
  </div>
</nav>

<!-- PAGE TITLE -->
<div class="container mt-4">
  <h1 class="text-center fw-bold">Report</h1>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-5">
  <div class="row g-4">

    <!-- LEFT COLUMN -->
    <div class="col-md-6">
      <div class="card p-4 shadow" style="height: 420px; border-radius: 20px; overflow-y: auto;">
        <h4 class="fw-bold" id="title">Document</h4>

        <div class="mt-2 text-muted" id="author"></div>
        <div class="text-muted mb-2" id="date"></div>

        <hr>

        <div class="mt-2" id="summary">
          Summary will appear here...
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-md-6">
      <div class="card p-4 shadow d-flex flex-column justify-content-between"
           style="height: 420px; border-radius: 20px;">

        <div>
          <h4 class="fw-bold text-center mb-4">Credibility Score</h4>

          <div class="progress mb-4" style="height: 24px; border-radius: 12px;">
            <div id="scoreBar" class="progress-bar bg-primary"
                 style="width: 0%; border-radius: 12px;">0%</div>
          </div>

        </div>

        <div class="d-grid gap-3 mt-4">
          <a href="detailed-report.html" class="btn btn-outline-secondary btn-lg">
            Detailed Report
          </a>

          <a href="score.html" class="btn btn-outline-secondary btn-lg">
            Score
          </a>

          <a href="index.html" class="btn btn-outline-secondary btn-lg">
            Home
          </a>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
window.onload = function() {

  const data = JSON.parse(localStorage.getItem("analysisResult"));

  if (!data) {
    window.location.href = "index.html";
    return;
  }

  document.getElementById("title").innerText = data.title || "No title";
  document.getElementById("summary").innerText = data.summary || "No summary";
  document.getElementById("author").innerText = "Author: " + (data.author || "Unknown");
  document.getElementById("date").innerText = "Published: " + (data.publication_date || "Unknown");

  // update progress bar with credibility score
  const score = Math.round(data.score || 0);
  const scoreBar = document.getElementById("scoreBar");

  scoreBar.style.width = score + "%";
  scoreBar.innerText = score + "%";

  if (score >= 75) {
    scoreBar.classList.remove("bg-primary");
    scoreBar.classList.add("bg-success");
  } else if (score >= 50) {
    scoreBar.classList.remove("bg-primary");
    scoreBar.classList.add("bg-warning");
  } else {
    scoreBar.classList.remove("bg-primary");
    scoreBar.classList.add("bg-danger");
  }

};
</script>

</body>
</html>
