<!DOCTYPE html>
<html>
<head>
  <title>Score</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-white">

<!-- NAVBAR -->
<nav class="navbar navbar-light border-bottom px-4">
  <span class="navbar-brand fw-bold">Credible Sorcerer</span>

  <div class="d-flex gap-3">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="report.html">Report</a>
    <a class="nav-link" href="#">Page</a>
    <button class="btn btn-dark btn-sm">Button</button>
  </div>
</nav>

<!-- PAGE TITLE -->
<div class="container mt-4">
  <h1 class="text-center fw-bold">Score</h1>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-5">
  <div class="row g-4">

    <!-- DOCUMENT -->
    <div class="col-md-4">
      <div class="card p-4" style="height: 500px; border-radius: 20px; overflow-y: auto;">
        <h4 class="fw-bold">Document</h4>
        <p class="text-muted mt-3" id="documentPreview">Document content goes here</p>
      </div>
    </div>

    <!-- SCORE BREAKDOWN -->
    <div class="col-md-4">
      <div class="card p-4" style="height: 500px; border-radius: 20px;">
        <h5 class="fw-bold text-center mb-4">Score: <span id="overallScore">--</span></h5>

        <p>Title / Metadata = <span id="metaScore">--</span></p>
        <p>Authorship = <span id="authorScore">--</span></p>
        <p>Publication Date = <span id="dateScore">--</span></p>
        <p>Potential Citations = <span id="citationScore">--</span></p>
        <p>AI Generation = <span id="aiScore">--</span></p>
      </div>
    </div>

    <!-- EXPLANATION -->
    <div class="col-md-4 d-flex flex-column align-items-center">

      <div class="card p-4 mb-4" style="height: 350px; border-radius: 20px; width: 100%; overflow-y: auto;">
        <h5 class="fw-bold text-center">Explanation</h5>
        <p class="text-muted mt-3" id="scoreExplanation">
          Explanation of score breakdown goes here
        </p>
      </div>

      <!-- BUTTONS -->
      <div class="d-grid gap-3" style="width: 200px;">
        <a href="score.html" class="btn btn-outline-secondary">
          Score
        </a>

        <a href="report.html" class="btn btn-outline-secondary">
          Back
        </a>

        <a href="index.html" class="btn btn-outline-secondary">
          Home
        </a>
      </div>

    </div>

  </div>
</div>

<script>
window.onload = function () {
  const data = JSON.parse(localStorage.getItem("analysisResult"));

  if (!data) {
    window.location.href = "index.html";
    return;
  }

  // document preview
  document.getElementById("documentPreview").innerText =
    data.text_preview || data.summary || "No content available";

  // overall score
  document.getElementById("overallScore").innerText =
    (data.score ?? "--") + "/100";

  // explanation
  document.getElementById("scoreExplanation").innerText =
    data.explanation || "No explanation available.";

  // basic parsing from explanation text
  const explanation = data.explanation || "";

  function extractLineValue(prefix) {
    const lines = explanation.split("\n");
    const line = lines.find(l => l.includes(prefix));
    if (!line) return "--";
    return line.split(" ")[0];
  }

  document.getElementById("metaScore").innerText =
    extractLineValue("Title");

  document.getElementById("authorScore").innerText =
    extractLineValue("Authorship");

  document.getElementById("dateScore").innerText =
    extractLineValue("Publication date");

  document.getElementById("citationScore").innerText =
    extractLineValue("citation links");

  document.getElementById("aiScore").innerText =
    extractLineValue("AI Detection");
};
</script>
</body>
</html>
