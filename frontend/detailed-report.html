<!DOCTYPE html>
<html>
<head>
  <title>Detailed Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-white">

<!-- NAVBAR -->
<nav class="navbar navbar-light border-bottom px-4">
  <span class="navbar-brand fw-bold">Credible Sorcerer</span>

  <div class="d-flex gap-3">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="report.html">Report</a>
    <a class="nav-link" href="#">Page</a>
    <button class="btn btn-dark btn-sm">Button</button>
  </div>
</nav>

<!-- PAGE TITLE -->
<div class="container mt-4">
  <h1 class="text-center fw-bold">Detailed Report</h1>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-5">
  <div class="row g-4">

    <!-- LEFT: DOCUMENT -->
    <div class="col-md-6">
      <div class="card p-4 shadow" style="height: 500px; border-radius: 20px; overflow-y: auto;">
        
        <h4 class="fw-bold mb-3">Document</h4>

        <div id="documentContent" class="text-muted">
          Document content or preview goes here...
        </div>

      </div>
    </div>

    <!-- RIGHT: KEY POINTS / CITATIONS -->
    <div class="col-md-6">
      <div class="card p-4 shadow" style="height: 500px; border-radius: 20px; overflow-y: auto;">
        
        <h4 class="fw-bold mb-3">Key Points</h4>

        <ul id="keyPoints" class="mb-4">
          <li>Key point 1</li>
          <li>Key point 2</li>
        </ul>

        <h5 class="fw-bold">Citations</h5>
        <ul id="citations" class="mb-4">
          <li>Source 1</li>
        </ul>

        <h5 class="fw-bold">Related Articles</h5>
        <ul id="relatedArticles">
          <li>Article link</li>
        </ul>

      </div>
    </div>

  </div>
</div>

<script>
window.onload = function() {

  const data = JSON.parse(localStorage.getItem("analysisResult"));

  if (!data) {
    window.location.href = "index.html";
    return;
  }

  // LEFT SIDE (document preview)
  document.getElementById("documentContent").innerText =
    data.summary || "No content available";

  // RIGHT SIDE (mock data for now)
  const keyPoints = [
    "Main topic of the article",
    "Important findings or arguments",
    "Key conclusion"
  ];

  const citations = [
    data.url || "Original article source"
  ];

  const related = [
    "Related article 1",
    "Related article 2"
  ];

  // Fill key points
  const kpList = document.getElementById("keyPoints");
  kpList.innerHTML = "";
  keyPoints.forEach(point => {
    const li = document.createElement("li");
    li.innerText = point;
    kpList.appendChild(li);
  });

  // Fill citations
  const citList = document.getElementById("citations");
  citList.innerHTML = "";
  citations.forEach(c => {
    const li = document.createElement("li");
    li.innerText = c;
    citList.appendChild(li);
  });

  // Fill related articles
  const relList = document.getElementById("relatedArticles");
  relList.innerHTML = "";
  related.forEach(r => {
    const li = document.createElement("li");
    li.innerText = r;
    relList.appendChild(li);
  });

};
</script>
</body>
</html>
