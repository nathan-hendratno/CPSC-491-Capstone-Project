<!DOCTYPE html>
<html>
<head>
  <title>Detailed Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-white">

<!-- NAVBAR -->
<nav class="navbar navbar-light border-bottom px-4">
  <span class="navbar-brand fw-bold">Credible Sorcerer</span>

  <div class="d-flex gap-3">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="report.html">Report</a>
    <a class="nav-link" href="#">Page</a>
    <button class="btn btn-dark btn-sm">Button</button>
  </div>
</nav>

<!-- PAGE TITLE -->
<div class="container mt-4">
  <h1 class="text-center fw-bold">Detailed Report</h1>
</div>

<!-- MAIN CONTENT -->
<div class="container mt-5">
  <div class="row g-4">

    <!-- LEFT: DOCUMENT -->
    <div class="col-md-6">
      <div class="card p-4 shadow" style="height: 500px; border-radius: 20px; overflow-y: auto;">
        
        <h4 class="fw-bold mb-3">Document</h4>

        <div id="documentContent" class="text-muted">
          Document content or preview goes here...
        </div>

      </div>
    </div>

    <!-- RIGHT: KEY POINTS / CITATIONS -->
    <div class="col-md-6">
      <div class="card p-4 shadow" style="height: 500px; border-radius: 20px; overflow-y: auto;">
        
        <h4 class="fw-bold mb-3">Key Points</h4>

        <ul id="keyPoints" class="mb-4">
          <li>Key point 1</li>
          <li>Key point 2</li>
        </ul>

        <h5 class="fw-bold">Citations</h5>
        <ul id="citations" class="mb-4">
          <li>Source 1</li>
        </ul>

        <h5 class="fw-bold">Related Articles</h5>
        <ul id="relatedArticles">
          <li>Article link</li>
        </ul>

      </div>
    </div>

  </div>
</div>

<div class="d-flex justify-content-center gap-3 mt-4 mb-5">

  <a href="report.html" class="btn btn-outline-secondary btn-lg px-4">
    Report
  </a>

  <a href="score.html" class="btn btn-outline-secondary btn-lg px-4">
    Score
  </a>

  <a href="index.html" class="btn btn-outline-secondary btn-lg px-4">
    Home
  </a>

</div>

<script>
window.onload = function() {

  const data = JSON.parse(localStorage.getItem("analysisResult"));

  if (!data) {
    window.location.href = "index.html";
    return;
  }

  // LEFT SIDE: document preview
  document.getElementById("documentContent").innerText =
    data.text_preview || "No content available";

  // RIGHT SIDE: key points
  const kpList = document.getElementById("keyPoints");
  kpList.innerHTML = "";

  (data.key_points || []).forEach(point => {
    const li = document.createElement("li");
    li.innerText = point;
    kpList.appendChild(li);
  });

  // RIGHT SIDE: citations / links
  const citList = document.getElementById("citations");
  citList.innerHTML = "";

  (data.links || []).slice(0, 5).forEach(link => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${link}" target="_blank">${link}</a>`;
    citList.appendChild(li);
  });

  // RIGHT SIDE: related articles (using topics for now)
    const relList = document.getElementById("relatedArticles");
  relList.innerHTML = "";

  (data.related_articles || []).forEach(article => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${article.url}" target="_blank">${article.title}</a>`;
    relList.appendChild(li);
  });

};
</script>
</body>
</html>
